name: iOS build

# Builds an unsigned Easea.ipa (sign it with Sideloadly or AltStore) and runs the engine tests.
on:
  push:
    paths:
      - "apple/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Engine tests
        working-directory: apple/Packages/EaseaCore
        run: swift test

      - name: Generate Xcode project
        working-directory: apple
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Video rendering tests (real files, macOS)
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild test \
            -project Easea.xcodeproj -scheme EaseaRenderTests \
            -destination 'platform=macOS' -derivedDataPath build-tests \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            | tee render-tests.log | grep -E "error:|Test Case .*(passed|failed)|XCTAssert|TEST (SUCCEEDED|FAILED)"

      - name: Build for iOS (unsigned)
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild build \
            -project Easea.xcodeproj -scheme Easea -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build-ios.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Easea.app

      - name: Package IPA
        working-directory: apple
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Easea.app Payload/
          zip -qry Easea.ipa Payload
          ls -lh Easea.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Easea-ipa
          path: apple/Easea.ipa
          if-no-files-found: error

      - name: Build for macOS (compile check)
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild build \
            -project Easea.xcodeproj -scheme Easea -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath build-mac \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | grep -E "error:|BUILD (SUCCEEDED|FAILED)"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            apple/build-ios.log
            apple/render-tests.log
          if-no-files-found: ignore
